<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>邻里山姆代购</title>
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: one narrow shopping column, category chips on top, sticky cart bar on the bottom edge, checkout as a full sheet */
:root{
  --bg:#f3f5f4;
  --card:#ffffff;
  --ink:#16302b;
  --muted:#5f716c;
  --line:#dbe3e0;
  --brand:#1f5c4f;
  --brand-ink:#ffffff;
  --price:#c2410c;
  --tint:#e3eeea;
  --warn:#9a3412;
  --font-body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"DIN Alternate","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1715;--card:#172320;--ink:#e4eeeb;--muted:#93a6a0;--line:#2a3a36;
  --brand:#5fb39e;--brand-ink:#0b1412;--price:#fb923c;--tint:#1d2e2a;--warn:#fdba74;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715;--card:#172320;--ink:#e4eeeb;--muted:#93a6a0;--line:#2a3a36;
  --brand:#5fb39e;--brand-ink:#0b1412;--price:#fb923c;--tint:#1d2e2a;--warn:#fdba74;color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 120px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

header.shop{padding-top:22px;display:flex;flex-direction:column;gap:4px}
header.shop h1{margin:0;font-size:26px;font-weight:700;text-wrap:balance;letter-spacing:.02em}
header.shop p{margin:0;color:var(--muted)}
.owner-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:var(--tint);border-radius:10px;padding:10px 12px;font-size:14px}
.owner-bar b{color:var(--brand)}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

.list{display:flex;flex-direction:column;background:var(--card);border-radius:14px;border:1px solid var(--line)}
.item{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.tile{width:52px;height:52px;border-radius:10px;background:var(--tint);color:var(--brand);
  display:grid;place-items:center;font-weight:700;font-size:20px}
.info{min-width:0;display:flex;flex-direction:column;gap:2px}
.info .name{font-weight:500;overflow-wrap:anywhere}
.info .spec{color:var(--muted);font-size:13px}
.price{color:var(--price);font-size:20px;font-weight:700;line-height:1.1}
.price small{font-size:14px;margin-right:1px}
.sample{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px;font-family:var(--font-body)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-size:18px;line-height:1;display:grid;place-items:center}
.stepper button.add{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.stepper .q{min-width:22px;text-align:center;font-size:19px;font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cartbar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px}
.cartbar .sum{flex:1;min-width:0;display:flex;flex-direction:column}
.cartbar .sum .t{font-size:24px;font-weight:700;color:var(--price);line-height:1.1}
.cartbar .sum .s{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:999px;padding:11px 22px;background:var(--brand);color:var(--brand-ink);font-weight:700;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.small{padding:6px 14px;font-size:13px}
.link{background:none;border:0;color:var(--brand);padding:0;text-decoration:underline;font-size:14px}

/* checkout */
.sheet{display:flex;flex-direction:column;gap:16px;padding-top:18px}
.sheet h2{margin:0;font-size:20px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h3{margin:0;font-size:13px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.row .l{min-width:0;overflow-wrap:anywhere}
.row.total{border-top:1px dashed var(--line);padding-top:10px;font-weight:700}
.row.total .num{font-size:26px;color:var(--price)}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px;width:100%}
.field textarea{min-height:64px;resize:vertical}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--tint);color:var(--brand)}
.qr{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.qr img{width:220px;max-width:100%;border-radius:10px;border:1px solid var(--line);background:#fff}
.qr .amt{font-size:34px;font-weight:700;color:var(--price);line-height:1}
.qr .noqr{border:1px dashed var(--line);border-radius:10px;padding:24px 16px;color:var(--muted);width:100%}
.steps{margin:0;padding-left:20px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:4px}
.err{color:var(--warn);font-size:14px}
.ordertext{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:10px;font-size:13px;white-space:pre-wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:9;
  background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px}

/* admin */
.adm-item{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.adm-item:first-of-type{border-top:0}
.adm-item .full{grid-column:1/-1}
.adm-item .acts{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:6px;font-size:14px}
.qrpick{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qrpick .box{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.qrpick img{width:120px;border-radius:8px;border:1px solid var(--line)}
@media (max-width:420px){.qrpick{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.stepper button{transition:transform .1s}.stepper button:active{transform:scale(.9)}}

.admin-hint{font-size:13px;color:var(--muted)}
.dl{display:block;text-align:center;text-decoration:none}
</style>
</head>

5t64S+OEO7m3rhL44Q56n+5e0c3PqZ5oR4e7m3rhL44Q7ubeuEvjhDnqf7l7Rzc+pnmhHh7ubeuEvjhDu5t64S+OEOep/uXtHNz6mf//Z"}}</script>

<script>
(function(){
// 在渲染前记下整个网页的原始内容，“生成新网页文件”时只替换上面的店铺设置
const SOURCE='<!doctype html>\n'+document.documentElement.outerHTML;
let S=JSON.parse(document.getElementById('config').textContent);
const app=document.getElementById('app');
let view=location.hash==='#admin'?'admin':'shop', cat='全部', cart={}, draft=null;
let co={name:'',contact:'',addr:'',note:'',ship:'送货上门',pay:'wx'};
let orderNo='';

function load(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}}
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
cart=load('sd-cart',{});Object.assign(co,load('sd-co',{}));co.note='';
function persist(){store('sd-cart',cart);store('sd-co',{name:co.name,contact:co.contact,addr:co.addr,ship:co.ship,pay:co.pay})}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Math.round((Number(n)||0)*100)/100).toFixed(2);
const yuan=n=>'<small>¥</small>'+money(n);
const byId=id=>S.products.find(p=>p.id===id);
const isWeChat=/MicroMessenger/i.test(navigator.userAgent);

function lines(){return Object.entries(cart).map(([id,q])=>({p:byId(id),q})).filter(x=>x.p&&x.p.on&&x.q>0)}
function totals(){const ls=lines();const goods=ls.reduce((a,x)=>a+x.p.price*x.q,0);const count=ls.reduce((a,x)=>a+x.q,0);
  const fee=count?Number(S.shop.fee)||0:0;return{ls,goods,count,fee,pay:goods+fee}}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
function setQty(id,d){cart[id]=Math.max(0,Math.min(99,(cart[id]||0)+d));if(!cart[id])delete cart[id];persist();render()}

/* ---------- 商品列表 ---------- */
function shopView(){
  const cats=['全部',...S.cats.filter(c=>S.products.some(p=>p.on&&p.cat===c))];
  if(!cats.includes(cat))cat='全部';
  const items=S.products.filter(p=>p.on&&(cat==='全部'||p.cat===cat));
  const T=totals();
  const anySample=S.products.some(p=>p.on&&p.sample);
  return `
  <div class="wrap">
    <header class="shop">
      <h1>${esc(S.shop.name)}</h1>
      ${S.shop.note?`<p>${esc(S.shop.note)}</p>`:''}
    </header>
    <nav class="chips" aria-label="商品分类">${cats.map(c=>`<button class="chip" aria-pressed="${c===cat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</nav>
    <section class="list">
      ${items.length?items.map(p=>{const q=cart[p.id]||0;return `
      <div class="item">
        <div class="tile" aria-hidden="true">${esc((p.cat||p.name||'货').slice(0,1))}</div>
        <div class="info">
          <span class="name">${esc(p.name)}</span>
          <span class="spec">${esc(p.spec)}</span>
          <span class="price num">${yuan(p.price)}${p.sample?'<span class="sample">示例价</span>':''}</span>
        </div>
        <div class="stepper">
          ${q?`<button aria-label="减少 ${esc(p.name)}" data-dec="${esc(p.id)}">−</button><span class="q num">${q}</span>`:''}
          <button class="add" aria-label="加一件 ${esc(p.name)}" data-inc="${esc(p.id)}">+</button>
        </div>
      </div>`}).join(''):`<div class="empty">这个分类暂时没有商品</div>`}
    </section>
    ${anySample?`<p style="margin:0;color:var(--muted);font-size:13px">标“示例价”的商品是样例，以店主更新后的价格为准。</p>`:''}
  </div>
  <div class="cartbar"><div class="in">
    <div class="sum"><span class="t num">${yuan(T.goods)}</span><span class="s">${T.count?`共 ${T.count} 件，另收代购费 ¥${money(S.shop.fee||0)}`:'还没选商品'}</span></div>
    <button class="btn" data-act="checkout" ${T.count?'':'disabled'}>去结算</button>
  </div></div>`;
}

/* ---------- 结算 ---------- */
function checkoutView(){
  const T=totals();
  if(!S.qr[co.pay]&&S.qr[co.pay==='wx'?'ali':'wx'])co.pay=co.pay==='wx'?'ali':'wx';
  const qr=S.qr[co.pay];
  const payName=co.pay==='wx'?'微信':'支付宝';
  const scanTip=co.pay==='wx'&&isWeChat?'长按收款码，选“识别图中二维码”付款':`长按收款码保存到相册，再用${payName}扫一扫，从相册选这张图付款`;
  return `
  <div class="wrap sheet">
    <div><button class="link" data-act="back">← 继续选购</button></div>
    <h2>确认订单</h2>
    <section class="panel">
      <h3>商品清单</h3>
      ${T.ls.map(x=>`<div class="row"><span class="l">${esc(x.p.name)} <span style="color:var(--muted)">× ${x.q}</span></span><span class="num">¥${money(x.p.price*x.q)}</span></div>`).join('')}
      <div class="row"><span class="l" style="color:var(--muted)">代购服务费</span><span class="num">¥${money(T.fee)}</span></div>
      <div class="row total"><span>应付</span><span class="num">¥${money(T.pay)}</span></div>
    </section>
    <section class="panel">
      <h3>收货信息</h3>
      <div class="seg" role="group" aria-label="配送方式">
        ${['送货上门','到店主家自提'].map(s=>`<button data-ship="${s}" aria-pressed="${co.ship===s}">${s}</button>`).join('')}
      </div>
      <div class="field"><label for="f-name">称呼</label><input id="f-name" data-co="name" value="${esc(co.name)}" placeholder="如：3 栋王姐"></div>
      <div class="field"><label for="f-contact">电话或微信号</label><input id="f-contact" data-co="contact" value="${esc(co.contact)}" placeholder="方便联系你"></div>
      ${co.ship==='送货上门'?`<div class="field"><label for="f-addr">送货地址</label><input id="f-addr" data-co="addr" value="${esc(co.addr)}" placeholder="小区、楼号、门牌"></div>`:''}
      <div class="field"><label for="f-note">备注（选填）</label><textarea id="f-note" data-co="note" placeholder="如：鸡蛋没货可以换别的">${esc(co.note)}</textarea></div>
    </section>
    <section class="panel">
      <h3>付款</h3>
      ${S.qr.wx&&S.qr.ali?`<div class="seg" role="group" aria-label="付款方式">
        <button data-pay="wx" aria-pressed="${co.pay==='wx'}">微信支付</button>
        <button data-pay="ali" aria-pressed="${co.pay==='ali'}">支付宝</button>
      </div>`:''}
      <div class="qr">
        <span style="color:var(--muted);font-size:13px">请支付</span>
        <span class="amt num">¥${money(T.pay)}</span>
        ${qr?`<img src="${qr}" alt="店主${payName}收款码">
          <span style="color:var(--muted);font-size:13px">${scanTip}，金额填 ¥${money(T.pay)}</span>`
          :`<div class="noqr">店主还没放收款码，请先提交订单，店主会联系你付款。</div>`}
      </div>
    </section>
    <section class="panel">
      <h3>提交订单</h3>
      <ol class="steps">
        <li>付款后点下面的按钮，订单会自动复制</li>
        <li>打开微信，粘贴发给店主${S.shop.wechat?`（微信号 <b style="color:var(--ink)">${esc(S.shop.wechat)}</b>）`:''}</li>
        <li>店主核对收款后回复你确认</li>
      </ol>
      <div class="err" id="co-err" hidden></div>
      <button class="btn" data-act="submit">付好了，复制订单</button>
      ${S.shop.wechat?`<button class="btn ghost" data-act="copywx">复制店主微信号</button>`:''}
    </section>
  </div>`;
}

function orderText(){
  const T=totals();
  const out=[`【${S.shop.name}·订单 ${orderNo}】`];
  T.ls.forEach(x=>out.push(`${x.p.name}（${x.p.spec}）× ${x.q} = ¥${money(x.p.price*x.q)}`));
  out.push('—————');
  out.push(`商品合计 ¥${money(T.goods)}`);
  out.push(`代购费 ¥${money(T.fee)}`);
  out.push(`应付 ¥${money(T.pay)}（已用${co.pay==='wx'?'微信':'支付宝'}付款）`);
  out.push('—————');
  out.push(`称呼：${co.name}`);
  out.push(`联系：${co.contact}`);
  out.push(`配送：${co.ship}${co.ship==='送货上门'?'，'+co.addr:''}`);
  if(co.note)out.push(`备注：${co.note}`);
  return out.join('\n');
}

function doneView(){
  return `
  <div class="wrap sheet">
    <h2>订单 ${esc(orderNo)} 已生成</h2>
    <section class="panel">
      <p style="margin:0">打开微信，把订单粘贴发给店主${S.shop.wechat?`（微信号 <b>${esc(S.shop.wechat)}</b>）`:''}就完成了。</p>
      <p style="margin:0;color:var(--muted);font-size:13px">如果没复制成功，长按下面的文字全选复制：</p>
      <textarea class="ordertext" id="ordertext" readonly>${esc(orderText())}</textarea>
      <button class="btn" data-act="recopy">再复制一次</button>
      <button class="btn ghost" data-act="newcart">完成，清空购物车</button>
    </section>
  </div>`;
}

async function copy(text,ta){
  try{await navigator.clipboard.writeText(text);return true}catch(e){}
  // 旧版微信浏览器的兜底复制
  try{const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';
    document.body.appendChild(t);t.select();t.setSelectionRange(0,text.length);const ok=document.execCommand('copy');t.remove();if(ok)return true}catch(e){}
  if(ta){ta.focus();ta.select()}return false;
}

function cleanDraft(){
  const c=JSON.parse(JSON.stringify(draft));
  c.shop.fee=Math.max(0,Number(c.shop.fee)||0);
  c.products=c.products.filter(p=>String(p.name).trim()).map(p=>({...p,name:String(p.name).trim(),price:Math.max(0,Math.round((Number(p.price)||0)*100)/100)}));
  return c;
}

function exportFile(){
  const c=cleanDraft();
  const json=JSON.stringify(c).replace(/</g,'\\u003c');
  const re=/(<script id="config" type="application\/json">)[\s\S]*?(<\/script>)/;
  if(!re.test(SOURCE)){const e=document.getElementById('adm-err');e.textContent='没找到设置区域，请用原始网页文件重新打开。';e.hidden=false;return}
  const html=SOURCE.replace(re,(m,a,b)=>a+json+b).replace(/<div id="app">[\s\S]*?<\/div>/,'<div id="app"></div>');
  const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));
  const out=document.getElementById('exportOut');
  out.innerHTML=`<section class="panel"><h3>新文件已生成</h3>
    <a class="btn dl" href="${url}" download="index.html">下载 index.html</a>
    <p class="admin-hint" style="margin:0">下载后把它上传到你放网页的地方，替换旧的 index.html。</p></section>`;
  S=c;store('sd-draft',null);
  try{out.querySelector('a').click()}catch(e){}
}

function readImage(file){return new Promise((res,rej)=>{
  const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{
    const max=640,s=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',0.9))};img.src=r.result};r.readAsDataURL(file)})}

/* ---------- 渲染与事件 ---------- */
function render(){
  if(view==='admin'&&!draft)draft=load('sd-draft',null)||JSON.parse(JSON.stringify(S));
  app.innerHTML=view==='shop'?shopView():view==='checkout'?checkoutView():view==='done'?doneView():adminView();
}
function saveDraft(){store('sd-draft',draft)}

app.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset;
  if(d.inc)return setQty(d.inc,1);
  if(d.dec)return setQty(d.dec,-1);
  if(d.cat){cat=d.cat;return render()}
  if(d.ship){co.ship=d.ship;persist();return render()}
  if(d.pay){co.pay=d.pay;persist();return render()}
  if(d.del){draft.products.splice(+d.del,1);saveDraft();return render()}
  if(d.clearqr){draft.qr[d.clearqr]='';saveDraft();return render()}
  switch(d.act){
    case 'checkout':view='checkout';render();scrollTo(0,0);break;
    case 'back':view='shop';render();break;
    case 'submit':{
      const err=document.getElementById('co-err');
      const miss=[];if(!co.name.trim())miss.push('称呼');if(!co.contact.trim())miss.push('电话或微信号');
      if(co.ship==='送货上门'&&!co.addr.trim())miss.push('送货地址');
      if(miss.length){err.textContent='请填写：'+miss.join('、');err.hidden=false;return}
      const now=new Date();orderNo=String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0')+'-'+String(Math.floor(Math.random()*900)+100);
      const ok=await copy(orderText());view='done';render();scrollTo(0,0);
      if(ok)toast('订单已复制');else{const ta=document.getElementById('ordertext');ta.focus();ta.select()}
      break}
    case 'recopy':{const ok=await copy(orderText(),document.getElementById('ordertext'));toast(ok?'已复制':'请长按文字手动复制');break}
    case 'copywx':{const ok=await copy(S.shop.wechat);toast(ok?'微信号已复制':'微信号：'+S.shop.wechat);break}
    case 'newcart':cart={};persist();view='shop';render();scrollTo(0,0);break;
    case 'cancelAdmin':view='shop';if(location.hash==='#admin')history.replaceState(null,'',location.pathname+location.search);render();break;
    case 'addProduct':draft.products.push({id:'p'+Date.now().toString(36),name:'',spec:'',price:0,cat:draft.cats[0]||'其他',on:true,sample:false});saveDraft();render();
      setTimeout(()=>{const ins=app.querySelectorAll('[data-k="name"]');ins[ins.length-1]?.focus()},0);break;
    case 'export':exportFile();break;
  }
});

app.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.co){co[d.co]=t.value;persist()}
  else if(d.shop){draft.shop[d.shop]=t.value;saveDraft()}
  else if('cats' in d){draft.cats=t.value.split(/[,，、]/).map(s=>s.trim()).filter(Boolean);saveDraft()}
  else if(d.p!==undefined&&d.k&&t.type!=='checkbox'){draft.products[+d.p][d.k]=t.value;saveDraft()}
});
app.addEventListener('change',async e=>{
  const t=e.target,d=t.dataset;
  if(d.p!==undefined&&t.type==='checkbox'){draft.products[+d.p][d.k]=t.checked;saveDraft();return}
  if('cats' in d){render();return}
  if(d.qr&&t.files&&t.files[0]){try{draft.qr[d.qr]=await readImage(t.files[0]);saveDraft();render()}catch(x){toast('图片读取失败，换一张试试')}}
});
window.addEventListener('hashchange',()=>{if(location.hash==='#admin'){view='admin';render();scrollTo(0,0)}});

render();
})();
</script></body></html>
